<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>File Converter</title>
    <script type="module" crossorigin src="/assets/index-vgqwTHDe.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BFubcaih.css">
  </head>
  <body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex items-center justify-center p-4">
    <div class="max-w-2xl w-full bg-white shadow-xl rounded-2xl overflow-hidden">
      <header class="bg-blue-600 text-white py-6 px-8">
        <h1 class="text-3xl font-bold">File Converter API</h1>
        <p class="text-blue-100 mt-2">Convert your files quickly and securely.</p>
      </header>

      <div class="p-8 space-y-8">
        <!-- Image Converter Section -->
        <section class="border border-gray-200 rounded-xl p-6 bg-gray-50">
          <h2 class="text-xl font-semibold mb-4 text-gray-700">Image Converter (JPG to PNG)</h2>
          <form id="image-form" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Upload JPG File</label>
              <input type="file" id="image-input" accept=".jpg,.jpeg" class="block w-full text-sm text-gray-500
                file:mr-4 file:py-2 file:px-4
                file:rounded-full file:border-0
                file:text-sm file:font-semibold
                file:bg-blue-50 file:text-blue-700
                hover:file:bg-blue-100 cursor-pointer" required />
            </div>
            <button type="submit" class="w-full sm:w-auto px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors">
              Convert to PNG
            </button>
            <p id="image-status" class="text-sm text-gray-500 hidden mt-2"></p>
          </form>
        </section>

        <!-- Document Converter Section -->
        <section class="border border-gray-200 rounded-xl p-6 bg-gray-50">
          <h2 class="text-xl font-semibold mb-4 text-gray-700">Document Converter (CSV to PDF)</h2>
          <form id="document-form" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Upload CSV File</label>
              <input type="file" id="document-input" accept=".csv" class="block w-full text-sm text-gray-500
                file:mr-4 file:py-2 file:px-4
                file:rounded-full file:border-0
                file:text-sm file:font-semibold
                file:bg-green-50 file:text-green-700
                hover:file:bg-green-100 cursor-pointer" required />
            </div>
            <button type="submit" class="w-full sm:w-auto px-6 py-2 bg-green-600 hover:bg-green-700 text-white font-medium rounded-lg transition-colors">
              Convert to PDF
            </button>
            <p id="document-status" class="text-sm text-gray-500 hidden mt-2"></p>
          </form>
        </section>
      </div>
    </div>
  </body>
</html>
