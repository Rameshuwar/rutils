<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal File Converter</title>
    <script type="module" crossorigin src="/assets/index-CsXdR1r2.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BeEZdlPW.css">
  </head>
  <body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex items-center justify-center p-4">
    <div class="max-w-xl w-full bg-white shadow-xl rounded-2xl overflow-hidden">
      <header class="bg-indigo-600 text-white py-6 px-8">
        <h1 class="text-3xl font-bold">Universal Converter</h1>
        <p class="text-indigo-100 mt-2">Dynamically convert your files securely.</p>
      </header>

      <div class="p-8 space-y-6">
        <form id="convert-form" class="space-y-6">
          
          <div class="grid grid-cols-2 gap-4">
            <!-- Source Format (Auto-detected display) -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Convert From</label>
              <div id="detection-box" class="w-full bg-gray-100 border border-gray-200 rounded-lg py-2 px-3 flex items-center h-[42px] transition-colors">
                <span id="detected-format-text" class="text-sm text-gray-500 font-medium">Auto-detected on upload</span>
              </div>
            </div>
            
            <!-- Convert To Dropdown -->
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-2">Convert To</label>
              <select id="to-type" class="w-full bg-white border border-gray-300 rounded-lg py-2 px-3 h-[42px] focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-sm">
                <option value="csv">CSV (Spreadsheet)</option>
                <option value="json">JSON (Data)</option>
                <option value="txt">TXT (Plain Text)</option>
                <option value="docx">DOCX (Word Document)</option>
                <option value="pdf">PDF (Document)</option>
                <option value="jpg">JPG (Image)</option>
                <option value="png">PNG (Image)</option>
              </select>
            </div>
          </div>

          <!-- File Upload -->
          <div class="bg-indigo-50 border border-indigo-100 rounded-lg p-4">
            <label class="block text-sm font-medium text-indigo-900 mb-2">Upload File</label>
            <input type="file" id="file-input" accept=".csv,.json,.txt,.docx,.pdf,.jpg,.png" class="block w-full text-sm text-gray-500
              file:mr-4 file:py-2 file:px-4
              file:rounded-full file:border-0
              file:text-sm file:font-semibold
              file:bg-indigo-600 file:text-white
              hover:file:bg-indigo-700 cursor-pointer" required />
          </div>

          <!-- Submit -->
          <button type="submit" class="w-full px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg transition-colors shadow-sm">
            Convert & Download
          </button>
          
          <p id="status-message" class="text-sm text-center hidden"></p>
        </form>
      </div>
    </div>
  </body>
</html>
