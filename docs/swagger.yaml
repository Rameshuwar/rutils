basePath: /
definitions:
  api.AgeRequest:
    properties:
      dob:
        description: 'format: YYYY-MM-DD'
        type: string
      today:
        description: 'format: YYYY-MM-DD'
        type: string
    type: object
  api.BMIRequest:
    properties:
      height:
        type: number
      heightUnit:
        description: e.g., "meters", "centimeters", "feet", "inches"
        type: string
      weight:
        type: number
      weightUnit:
        description: e.g., "kilograms", "pounds"
        type: string
    type: object
  api.BMIResponse:
    properties:
      bmi:
        type: number
      category:
        type: string
    type: object
  api.EMIRequest:
    properties:
      annualInterestRate:
        type: number
      principal:
        type: number
      tenure:
        type: number
      tenureUnit:
        description: '"months" or "years"'
        type: string
    type: object
  api.MeasurementRequest:
    properties:
      category:
        type: string
      fromUnit:
        type: string
      toUnit:
        type: string
      value:
        type: number
    type: object
  api.MeasurementResponse:
    properties:
      result:
        type: number
    type: object
  api.NumeralRequest:
    properties:
      fromBase:
        type: string
      toBase:
        type: string
      value:
        type: string
    type: object
  api.NumeralResponse:
    properties:
      result:
        type: string
    type: object
  api.PercentageRequest:
    properties:
      operation:
        type: string
      value1:
        type: number
      value2:
        type: number
      value3:
        type: number
    type: object
  api.TaxRequest:
    properties:
      amount:
        description: GST / VAT style
        type: number
      grossAmount:
        type: number
      income:
        description: Income-tax style
        type: number
      mode:
        type: string
      netAmount:
        type: number
      regime:
        type: string
      slabs:
        items:
          $ref: '#/definitions/converter.TaxSlab'
        type: array
      taxPaid:
        type: number
      taxRate:
        type: number
      taxType:
        type: string
    type: object
  auth.ChangePasswordRequest:
    properties:
      confirm_password:
        example: BrandNewStrongP@ss2!
        type: string
      current_password:
        example: CurrentStrongP@ss1!
        type: string
      new_password:
        example: BrandNewStrongP@ss2!
        type: string
    type: object
  auth.ForgotPasswordRequest:
    properties:
      email:
        example: jane@example.com
        type: string
    type: object
  auth.LoginRequest:
    properties:
      email:
        example: jane@example.com
        type: string
      password:
        example: StrongP@ssw0rd!
        type: string
    type: object
  auth.LoginResponse:
    properties:
      message:
        example: Login successful
        type: string
      must_reset_password:
        example: false
        type: boolean
      token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      user:
        $ref: '#/definitions/auth.UserResponse'
    type: object
  auth.MessageResponse:
    properties:
      message:
        example: Operation completed successfully
        type: string
      success:
        example: true
        type: boolean
    type: object
  auth.RegisterRequest:
    properties:
      confirm_password:
        example: StrongP@ssw0rd!
        type: string
      email:
        example: jane@example.com
        type: string
      name:
        example: Jane Doe
        type: string
      password:
        example: StrongP@ssw0rd!
        type: string
    type: object
  auth.ResetPasswordRequest:
    properties:
      confirm_password:
        example: NewStrongP@ssw0rd123!
        type: string
      new_password:
        example: NewStrongP@ssw0rd123!
        type: string
    type: object
  auth.UserResponse:
    properties:
      created_at:
        type: string
      email:
        example: jane@example.com
        type: string
      id:
        example: u_984f1a23
        type: string
      must_reset_password:
        example: false
        type: boolean
      name:
        example: Jane Doe
        type: string
    type: object
  converter.AgeCalculationResponse:
    properties:
      age:
        $ref: '#/definitions/converter.AgeResult'
      nextBirthday:
        $ref: '#/definitions/converter.NextBirthday'
      summary:
        $ref: '#/definitions/converter.Summary'
    type: object
  converter.AgeResult:
    properties:
      days:
        type: integer
      months:
        type: integer
      years:
        type: integer
    type: object
  converter.AmortizationRow:
    properties:
      closingBalance:
        type: number
      interestPaid:
        type: number
      month:
        type: integer
      openingBalance:
        type: number
      principalPaid:
        type: number
      totalPaid:
        type: number
    type: object
  converter.EMIBreakdown:
    properties:
      interestPercent:
        type: number
      principalPercent:
        type: number
    type: object
  converter.EMIResponse:
    properties:
      amortization:
        items:
          $ref: '#/definitions/converter.AmortizationRow'
        type: array
      breakdown:
        $ref: '#/definitions/converter.EMIBreakdown'
      emi:
        type: number
      monthlyRatePercent:
        type: number
      principal:
        type: number
      tenureMonths:
        type: integer
      totalInterest:
        type: number
      totalPayment:
        type: number
    type: object
  converter.ExtractResponse:
    properties:
      extractedAt:
        description: RFC3339 UTC
        type: string
      language:
        type: string
      pageCount:
        type: integer
      pages:
        description: per-page breakdown
        items:
          $ref: '#/definitions/converter.PageExtract'
        type: array
      sourceType:
        description: '"pdf" | "image"'
        type: string
      text:
        description: concatenated text
        type: string
      warnings:
        description: non-fatal notices
        items:
          type: string
        type: array
    type: object
  converter.NextBirthday:
    properties:
      date:
        type: string
      day:
        type: integer
      dayOfWeek:
        type: string
      daysRemaining:
        type: integer
      month:
        type: integer
      monthsRemaining:
        type: integer
    type: object
  converter.PageExtract:
    properties:
      page:
        type: integer
      text:
        type: string
    type: object
  converter.PercentageResponse:
    properties:
      extra:
        additionalProperties: true
        type: object
      formatted:
        type: string
      operation:
        type: string
      result:
        type: number
      steps:
        items:
          type: string
        type: array
    type: object
  converter.RailwayConversionRequest:
    properties:
      ampm:
        description: '"AM" or "PM"'
        type: string
      direction:
        description: '"12to24" or "24to12"'
        type: string
      hour:
        type: integer
      minute:
        type: integer
    type: object
  converter.RailwayConversionResponse:
    properties:
      ampm:
        type: string
      hour_12:
        type: integer
      hour_24:
        type: integer
      minute:
        type: integer
    type: object
  converter.Summary:
    properties:
      days:
        type: integer
      hours:
        type: integer
      minutes:
        type: integer
      months:
        type: integer
      weeks:
        type: integer
      years:
        type: integer
    type: object
  converter.TaxResponse:
    properties:
      extra:
        additionalProperties: true
        type: object
      formatted:
        type: string
      grossAmount:
        type: number
      mode:
        type: string
      netAmount:
        type: number
      steps:
        items:
          type: string
        type: array
      taxAmount:
        type: number
      taxRate:
        type: number
    type: object
  converter.TaxSlab:
    properties:
      from:
        type: number
      rate:
        type: number
      to:
        description: 0 == no upper bound
        type: number
    type: object
  converter.TimeConversionRequest:
    properties:
      ambiguous_policy:
        description: 'Policy for ambiguous times (fall back): "first" (default) or
          "second"'
        type: string
      day:
        type: integer
      dest_tz:
        description: e.g., "Asia/Tokyo"
        type: string
      hour:
        type: integer
      minute:
        type: integer
      month:
        type: integer
      non_existent_policy:
        description: 'Policy for non-existent times (spring forward): "forward" (default,
          shifts forward) or "error"'
        type: string
      second:
        type: integer
      source_tz:
        description: e.g., "America/New_York"
        type: string
      year:
        type: integer
    type: object
  converter.TimeConversionResponse:
    properties:
      dest_offset:
        type: string
      dest_time_local:
        description: ISO 8601 with offset
        type: string
      dest_time_utc:
        description: ISO 8601
        type: string
      dest_zone_name:
        type: string
      is_next_day:
        type: boolean
      is_prev_day:
        type: boolean
      resolution:
        $ref: '#/definitions/converter.TimeResolution'
      source_offset:
        description: e.g. "-04:00"
        type: string
      source_time_local:
        description: ISO 8601 with offset
        type: string
      source_time_utc:
        description: ISO 8601
        type: string
      source_zone_name:
        description: e.g. "EDT"
        type: string
      warning:
        type: string
    type: object
  converter.TimeResolution:
    enum:
    - normal
    - ambiguous
    - non-existent
    type: string
    x-enum-varnames:
    - ResolutionNormal
    - ResolutionAmbiguous
    - ResolutionNonExistent
host: localhost:8080
info:
  contact: {}
  description: Utility Microservice for converting files and user authentication.
  title: File Converter API
  version: "1.0"
paths:
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Changes the password for the currently authenticated user and sends
        an email confirmation. Requires Bearer JWT.
      parameters:
      - description: Change Password Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password changed successfully
          schema:
            $ref: '#/definitions/auth.MessageResponse'
        "400":
          description: Validation error or weak password
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Current password incorrect or unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Change password for logged-in user
      tags:
      - Authentication
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Sends a temporary password to the user's email. When used to log
        in, forces password reset.
      parameters:
      - description: Forgot Password Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Temporary password dispatched
          schema:
            $ref: '#/definitions/auth.MessageResponse'
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Account not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Send temporary password via Google SMTP
      tags:
      - Authentication
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates user credentials and returns a signed JWT token.
        If logged in with a temporary password, must_reset_password will be true.
      parameters:
      - description: User Login Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid credentials
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login with email and password
      tags:
      - Authentication
  /auth/logout:
    post:
      description: Clears the user's authentication session
      produces:
      - application/json
      responses:
        "200":
          description: Logout successful
          schema:
            $ref: '#/definitions/auth.MessageResponse'
      summary: Logout user
      tags:
      - Authentication
  /auth/me:
    get:
      description: Returns the profile details for the authenticated user. Requires
        Bearer JWT.
      produces:
      - application/json
      responses:
        "200":
          description: User profile
          schema:
            $ref: '#/definitions/auth.UserResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get logged-in user profile
      tags:
      - Authentication
  /auth/register:
    post:
      consumes:
      - application/json
      description: Registers a new user with name, email, password, and confirm_password.
        Requires strong password.
      parameters:
      - description: User Registration Information
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: User registered successfully
          schema:
            $ref: '#/definitions/auth.UserResponse'
        "400":
          description: Validation error or weak password
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Email already registered
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new user
      tags:
      - Authentication
  /auth/reset-password:
    post:
      consumes:
      - application/json
      description: Sets a permanent password for a user logged in with a temporary
        password. Requires Bearer JWT.
      parameters:
      - description: Reset Password Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password updated successfully
          schema:
            $ref: '#/definitions/auth.MessageResponse'
        "400":
          description: Validation error or weak password
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Reset password
      tags:
      - Authentication
  /calculate-age:
    post:
      consumes:
      - application/json
      description: Calculates exact age, next birthday, and life summary based on
        date of birth and a reference date.
      parameters:
      - description: Age Calculation Request (Dates in YYYY-MM-DD format)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.AgeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Age Result
          schema:
            $ref: '#/definitions/converter.AgeCalculationResponse'
        "400":
          description: Bad Request
          schema:
            type: string
      summary: Age Calculator
  /calculate-bmi:
    post:
      consumes:
      - application/json
      description: Calculates Body Mass Index (BMI) based on weight and height
      parameters:
      - description: BMI Calculation Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.BMIRequest'
      produces:
      - application/json
      responses:
        "200":
          description: BMI Result
          schema:
            $ref: '#/definitions/api.BMIResponse'
        "400":
          description: Bad Request
          schema:
            type: string
      summary: BMI Calculator
  /calculate-emi:
    post:
      consumes:
      - application/json
      description: |-
        Calculates the Equated Monthly Installment (EMI) for a loan along with
        the total interest, total payment, principal/interest split, and a
        month-by-month amortization schedule.

        **Formula:** `EMI = [P × r × (1+r)^N] / [(1+r)^N − 1]`
        where `r` is the monthly interest rate (annual / 12 / 100) and `N` is
        the tenure in months.

        **Special case:** an annual interest rate of `0` returns a simple
        `principal / tenure` division (interest-free loan).

        **Limits:**
        - `principal` must be positive and ≤ 1 trillion.
        - `annualInterestRate` must be between 0 and 100.
        - `tenure` must be positive; tenure in months must be ≤ 600.
        - `tenureUnit` must be exactly `"months"` or `"years"`.
      parameters:
      - description: EMI Calculation Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.EMIRequest'
      produces:
      - application/json
      responses:
        "200":
          description: EMI Result
          schema:
            $ref: '#/definitions/converter.EMIResponse'
        "400":
          description: Bad Request - invalid input
          schema:
            type: string
      summary: Loan EMI Calculator
      tags:
      - Calculators
  /calculate-percentage:
    post:
      consumes:
      - application/json
      description: |-
        Performs any percentage operation (X% of Y, what %, change, increase, decrease,

        **Supported operations (`operation` field):**
        - `percent_of`              (value1 = percent, value2 = number)
        - `what_percent`            (value1 = part, value2 = whole)
        - `percent_change`          (value1 = old, value2 = new)
        - `percent_increase`        (value1 = number, value2 = percent)
        - `percent_decrease`        (value1 = number, value2 = percent)
        - `reverse_percent`         (value1 = final, value2 = percent)
        - `is_percent_of_what`      (value1 = part, value2 = percent)
        - `percent_difference`      (value1 = a, value2 = b)
        - `add_percent_points`      (value1 = p1%, value2 = p2%)
        - `subtract_percent_points` (value1 = p1%, value2 = p2%)
        - `discount`                (value1 = price, value2 = discount%)
        - `markup`                  (value1 = cost, value2 = markup%)
        - `profit_loss`             (value1 = cost, value2 = selling)
        - `percent_to_fraction`     (value1 = percent)
        - `fraction_to_percent`     (value1 = numerator, value2 = denominator)
        - `decimal_to_percent`      (value1 = decimal)
        - `compound_percent`        (value1 = base, value2 = percent, value3 = periods)
        - `marks_percentage`        (value1 = obtained, value2 = total)
        - `cgpa_to_percent`         (value1 = cgpa; uses CBSE factor 9.5)
      parameters:
      - description: Percentage Calculation Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.PercentageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Percentage Result
          schema:
            $ref: '#/definitions/converter.PercentageResponse'
        "400":
          description: Bad Request - invalid operation or parameters
          schema:
            type: string
      summary: Percentage Calculator
      tags:
      - Percentage Calculator
  /calculate-tax:
    post:
      consumes:
      - application/json
      description: |-
        Performs any tax calculation through a single `mode`-discriminated endpoint.

        **Supported modes (`mode` field):**
        - `add_tax`      (amount, taxRate)                       — exclusive → inclusive
        - `remove_tax`   (amount, taxRate)                       — inclusive → exclusive
        - `find_rate`    (netAmount, grossAmount)                — effective tax rate
        - `split_gst`    (amount, taxRate, taxType)              — CGST+SGST or IGST breakdown
        - `reverse_gst`  (taxPaid, taxRate)                      — recover net from tax paid
        - `income_tax`   (income, slabs[], regime?)              — progressive slab tax

        **Notes:**
        - The endpoint is country-neutral: the client supplies the rate and, for income tax, the slab schedule.
        - For `split_gst`, `taxType` must be `cgst_sgst` (default) or `igst`.
        - For `income_tax`, slabs must be non-overlapping; at most one slab may have `to = 0` (open-ended).
      parameters:
      - description: Tax Calculation Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.TaxRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Tax Result
          schema:
            $ref: '#/definitions/converter.TaxResponse'
        "400":
          description: Bad Request - invalid mode or parameters
          schema:
            type: string
      summary: Tax / VAT / GST Calculator
      tags:
      - Calculators
  /convert:
    post:
      consumes:
      - multipart/form-data
      description: Converts any supported file type to another supported file type
        dynamically.
      parameters:
      - description: Source file type (e.g. txt, csv, json, pdf, docx, jpg, png)
        in: formData
        name: fromType
        required: true
        type: string
      - description: Target file type (e.g. txt, csv, json, pdf, docx, jpg, png)
        in: formData
        name: toType
        required: true
        type: string
      - description: The file to convert
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/octet-stream
      responses:
        "200":
          description: The converted file
          schema:
            type: file
        "400":
          description: Bad Request or unsupported combination
          schema:
            type: string
      summary: Universal File Converter
  /convert-measurement:
    post:
      consumes:
      - application/json
      description: Converts measurements between different units (e.g., meters to
        feet)
      parameters:
      - description: Conversion Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.MeasurementRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Conversion Result
          schema:
            $ref: '#/definitions/api.MeasurementResponse'
        "400":
          description: Bad Request
          schema:
            type: string
      summary: Measurement Converter
  /convert-numeral:
    post:
      consumes:
      - application/json
      description: Converts between numeral systems like binary, decimal, octal, hexadecimal.
      parameters:
      - description: Conversion Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.NumeralRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Conversion Result
          schema:
            $ref: '#/definitions/api.NumeralResponse'
        "400":
          description: Bad Request
          schema:
            type: string
      summary: Numeral System Converter
  /convert-pdf-size:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Upload a PDF and convert it toward a requested target file size.

        **Ranges:**
        - Compression: target must be between **10 KB** and **400 MB**.
        - Expansion:   target must be between **10 KB** and **6000 KB**.
        - Uploaded file must not exceed **600 MB**.

        **Response headers:**
        - `X-Conversion-Target-Met`: `true` if the target was reached, `false` if the smallest achievable size was returned.
        - `X-Conversion-Target-Size`: the requested target in bytes.
        - `X-Conversion-Actual-Size`: the actual output size in bytes.
      parameters:
      - description: PDF file (max 600 MB)
        in: formData
        name: file
        required: true
        type: file
      - description: compression or expand
        in: formData
        name: conversionType
        required: true
        type: string
      - description: KB or MB
        in: formData
        name: dataType
        required: true
        type: string
      - description: Target file size
        in: formData
        name: targetSize
        required: true
        type: number
      produces:
      - application/pdf
      responses:
        "200":
          description: Converted PDF
          schema:
            type: file
        "400":
          description: Bad Request - invalid parameters
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Compress or expand PDF
      tags:
      - PDF Converter
  /convert-railway:
    post:
      consumes:
      - application/json
      description: Converts between 12-hour AM/PM and 24-hour Indian Railway time
        format.
