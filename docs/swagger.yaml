basePath: /
definitions:
  api.AgeRequest:
    properties:
      dob:
        description: 'format: YYYY-MM-DD'
        type: string
      today:
        description: 'format: YYYY-MM-DD'
        type: string
    type: object
  api.BMIRequest:
    properties:
      height:
        type: number
      heightUnit:
        description: e.g., "meters", "centimeters", "feet", "inches"
        type: string
      weight:
        type: number
      weightUnit:
        description: e.g., "kilograms", "pounds"
        type: string
    type: object
  api.BMIResponse:
    properties:
      bmi:
        type: number
      category:
        type: string
    type: object
  api.MeasurementRequest:
    properties:
      category:
        type: string
      fromUnit:
        type: string
      toUnit:
        type: string
      value:
        type: number
    type: object
  api.MeasurementResponse:
    properties:
      result:
        type: number
    type: object
  api.NumeralRequest:
    properties:
      fromBase:
        type: string
      toBase:
        type: string
      value:
        type: string
    type: object
  api.NumeralResponse:
    properties:
      result:
        type: string
    type: object
  api.PercentageRequest:
    properties:
      operation:
        type: string
      value1:
        type: number
      value2:
        type: number
      value3:
        type: number
    type: object
  converter.AgeCalculationResponse:
    properties:
      age:
        $ref: '#/definitions/converter.AgeResult'
      nextBirthday:
        $ref: '#/definitions/converter.NextBirthday'
      summary:
        $ref: '#/definitions/converter.Summary'
    type: object
  converter.AgeResult:
    properties:
      days:
        type: integer
      months:
        type: integer
      years:
        type: integer
    type: object
  converter.NextBirthday:
    properties:
      date:
        type: string
      day:
        type: integer
      dayOfWeek:
        type: string
      daysRemaining:
        type: integer
      month:
        type: integer
      monthsRemaining:
        type: integer
    type: object
  converter.PercentageResponse:
    properties:
      extra:
        additionalProperties: true
        type: object
      formatted:
        type: string
      operation:
        type: string
      result:
        type: number
      steps:
        items:
          type: string
        type: array
    type: object
  converter.RailwayConversionRequest:
    properties:
      ampm:
        description: '"AM" or "PM"'
        type: string
      direction:
        description: '"12to24" or "24to12"'
        type: string
      hour:
        type: integer
      minute:
        type: integer
    type: object
  converter.RailwayConversionResponse:
    properties:
      ampm:
        type: string
      hour_12:
        type: integer
      hour_24:
        type: integer
      minute:
        type: integer
    type: object
  converter.Summary:
    properties:
      days:
        type: integer
      hours:
        type: integer
      minutes:
        type: integer
      months:
        type: integer
      weeks:
        type: integer
      years:
        type: integer
    type: object
  converter.TimeConversionRequest:
    properties:
      ambiguous_policy:
        description: 'Policy for ambiguous times (fall back): "first" (default) or
          "second"'
        type: string
      day:
        type: integer
      dest_tz:
        description: e.g., "Asia/Tokyo"
        type: string
      hour:
        type: integer
      minute:
        type: integer
      month:
        type: integer
      non_existent_policy:
        description: 'Policy for non-existent times (spring forward): "forward" (default,
          shifts forward) or "error"'
        type: string
      second:
        type: integer
      source_tz:
        description: e.g., "America/New_York"
        type: string
      year:
        type: integer
    type: object
  converter.TimeConversionResponse:
    properties:
      dest_offset:
        type: string
      dest_time_local:
        description: ISO 8601 with offset
        type: string
      dest_time_utc:
        description: ISO 8601
        type: string
      dest_zone_name:
        type: string
      is_next_day:
        type: boolean
      is_prev_day:
        type: boolean
      resolution:
        $ref: '#/definitions/converter.TimeResolution'
      source_offset:
        description: e.g. "-04:00"
        type: string
      source_time_local:
        description: ISO 8601 with offset
        type: string
      source_time_utc:
        description: ISO 8601
        type: string
      source_zone_name:
        description: e.g. "EDT"
        type: string
      warning:
        type: string
    type: object
  converter.TimeResolution:
    enum:
    - normal
    - ambiguous
    - non-existent
    type: string
    x-enum-varnames:
    - ResolutionNormal
    - ResolutionAmbiguous
    - ResolutionNonExistent
host: localhost:8080
info:
  contact: {}
  description: Utility Microservice for converting files.
  title: File Converter API
  version: "1.0"
paths:
  /calculate-age:
    post:
      consumes:
      - application/json
      description: Calculates exact age, next birthday, and life summary based on
        date of birth and a reference date.
      parameters:
      - description: Age Calculation Request (Dates in YYYY-MM-DD format)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.AgeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Age Result
          schema:
            $ref: '#/definitions/converter.AgeCalculationResponse'
        "400":
          description: Bad Request
          schema:
            type: string
      summary: Age Calculator
  /calculate-bmi:
    post:
      consumes:
      - application/json
      description: Calculates Body Mass Index (BMI) based on weight and height
      parameters:
      - description: BMI Calculation Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.BMIRequest'
      produces:
      - application/json
      responses:
        "200":
          description: BMI Result
          schema:
            $ref: '#/definitions/api.BMIResponse'
        "400":
          description: Bad Request
          schema:
            type: string
      summary: BMI Calculator
  /calculate-percentage:
    post:
      consumes:
      - application/json
      description: |-
        Performs any percentage operation (X% of Y, what %, change, increase, decrease,

        **Supported operations (`operation` field):**
        - `percent_of`              (value1 = percent, value2 = number)
        - `what_percent`            (value1 = part, value2 = whole)
        - `percent_change`          (value1 = old, value2 = new)
        - `percent_increase`        (value1 = number, value2 = percent)
        - `percent_decrease`        (value1 = number, value2 = percent)
        - `reverse_percent`         (value1 = final, value2 = percent)
        - `is_percent_of_what`      (value1 = part, value2 = percent)
        - `percent_difference`      (value1 = a, value2 = b)
        - `add_percent_points`      (value1 = p1%, value2 = p2%)
        - `subtract_percent_points` (value1 = p1%, value2 = p2%)
        - `discount`                (value1 = price, value2 = discount%)
        - `markup`                  (value1 = cost, value2 = markup%)
        - `profit_loss`             (value1 = cost, value2 = selling)
        - `percent_to_fraction`     (value1 = percent)
        - `fraction_to_percent`     (value1 = numerator, value2 = denominator)
        - `decimal_to_percent`      (value1 = decimal)
        - `compound_percent`        (value1 = base, value2 = percent, value3 = periods)
        - `marks_percentage`        (value1 = obtained, value2 = total)
        - `cgpa_to_percent`         (value1 = cgpa; uses CBSE factor 9.5)
      parameters:
      - description: Percentage Calculation Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.PercentageRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Percentage Result
          schema:
            $ref: '#/definitions/converter.PercentageResponse'
        "400":
          description: Bad Request - invalid operation or parameters
          schema:
            type: string
      summary: Percentage Calculator
      tags:
      - Percentage Calculator
  /convert:
    post:
      consumes:
      - multipart/form-data
      description: Converts any supported file type to another supported file type
        dynamically.
      parameters:
      - description: Source file type (e.g. txt, csv, json, pdf, docx, jpg, png)
        in: formData
        name: fromType
        required: true
        type: string
      - description: Target file type (e.g. txt, csv, json, pdf, docx, jpg, png)
        in: formData
        name: toType
        required: true
        type: string
      - description: The file to convert
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/octet-stream
      responses:
        "200":
          description: The converted file
          schema:
            type: file
        "400":
          description: Bad Request or unsupported combination
          schema:
            type: string
      summary: Universal File Converter
  /convert-measurement:
    post:
      consumes:
      - application/json
      description: Converts measurements between different units (e.g., meters to
        feet)
      parameters:
      - description: Conversion Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.MeasurementRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Conversion Result
          schema:
            $ref: '#/definitions/api.MeasurementResponse'
        "400":
          description: Bad Request
          schema:
            type: string
      summary: Measurement Converter
  /convert-numeral:
    post:
      consumes:
      - application/json
      description: Converts between numeral systems like binary, decimal, octal, hexadecimal.
      parameters:
      - description: Conversion Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.NumeralRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Conversion Result
          schema:
            $ref: '#/definitions/api.NumeralResponse'
        "400":
          description: Bad Request
          schema:
            type: string
      summary: Numeral System Converter
  /convert-pdf-size:
    post:
      consumes:
      - multipart/form-data
      description: |-
        Upload a PDF and convert it toward a requested target file size.

        **Ranges:**
        - Compression: target must be between **10 KB** and **400 MB**.
        - Expansion:   target must be between **10 KB** and **6000 KB**.
        - Uploaded file must not exceed **600 MB**.

        **Response headers:**
        - `X-Conversion-Target-Met`: `true` if the target was reached, `false` if the smallest achievable size was returned.
        - `X-Conversion-Target-Size`: the requested target in bytes.
        - `X-Conversion-Actual-Size`: the actual output size in bytes.
      parameters:
      - description: PDF file (max 600 MB)
        in: formData
        name: file
        required: true
        type: file
      - description: compression or expand
        in: formData
        name: conversionType
        required: true
        type: string
      - description: KB or MB
        in: formData
        name: dataType
        required: true
        type: string
      - description: Target file size
        in: formData
        name: targetSize
        required: true
        type: number
      produces:
      - application/pdf
      responses:
        "200":
          description: Converted PDF
          schema:
            type: file
        "400":
          description: Bad Request - invalid parameters
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: Compress or expand PDF
      tags:
      - PDF Converter
  /convert-railway:
    post:
      consumes:
      - application/json
      description: Converts between 12-hour AM/PM and 24-hour Indian Railway time
        format.
      parameters:
      - description: Railway Conversion Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/converter.RailwayConversionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Conversion Result
          schema:
            $ref: '#/definitions/converter.RailwayConversionResponse'
        "400":
          description: Bad Request
          schema:
            type: string
      summary: Railway Time Converter
  /convert-time:
    post:
      consumes:
      - application/json
      description: Converts date and time from any location/time zone to any other
        location/time zone accurately.
      parameters:
      - description: Time Conversion Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/converter.TimeConversionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Conversion Result
          schema:
            $ref: '#/definitions/converter.TimeConversionResponse'
        "400":
          description: Bad Request
          schema:
            type: string
      summary: Universal Time Converter
swagger: "2.0"
