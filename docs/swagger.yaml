basePath: /
definitions:
  api.AgeRequest:
    properties:
      dob:
        description: 'format: YYYY-MM-DD'
        type: string
      today:
        description: 'format: YYYY-MM-DD'
        type: string
    type: object
  api.BMIRequest:
    properties:
      height:
        type: number
      heightUnit:
        description: e.g., "meters", "centimeters", "feet", "inches"
        type: string
      weight:
        type: number
      weightUnit:
        description: e.g., "kilograms", "pounds"
        type: string
    type: object
  api.BMIResponse:
    properties:
      bmi:
        type: number
      category:
        type: string
    type: object
  api.MeasurementRequest:
    properties:
      category:
        type: string
      fromUnit:
        type: string
      toUnit:
        type: string
      value:
        type: number
    type: object
  api.MeasurementResponse:
    properties:
      result:
        type: number
    type: object
  api.NumeralRequest:
    properties:
      fromBase:
        type: string
      toBase:
        type: string
      value:
        type: string
    type: object
  api.NumeralResponse:
    properties:
      result:
        type: string
    type: object
  converter.AgeCalculationResponse:
    properties:
      age:
        $ref: '#/definitions/converter.AgeResult'
      nextBirthday:
        $ref: '#/definitions/converter.NextBirthday'
      summary:
        $ref: '#/definitions/converter.Summary'
    type: object
  converter.AgeResult:
    properties:
      days:
        type: integer
      months:
        type: integer
      years:
        type: integer
    type: object
  converter.NextBirthday:
    properties:
      date:
        type: string
      day:
        type: integer
      dayOfWeek:
        type: string
      daysRemaining:
        type: integer
      month:
        type: integer
      monthsRemaining:
        type: integer
    type: object
  converter.RailwayConversionRequest:
    properties:
      ampm:
        description: '"AM" or "PM"'
        type: string
      direction:
        description: '"12to24" or "24to12"'
        type: string
      hour:
        type: integer
      minute:
        type: integer
    type: object
  converter.RailwayConversionResponse:
    properties:
      ampm:
        type: string
      hour_12:
        type: integer
      hour_24:
        type: integer
      minute:
        type: integer
    type: object
  converter.Summary:
    properties:
      days:
        type: integer
      hours:
        type: integer
      minutes:
        type: integer
      months:
        type: integer
      weeks:
        type: integer
      years:
        type: integer
    type: object
  converter.TimeConversionRequest:
    properties:
      ambiguous_policy:
        description: 'Policy for ambiguous times (fall back): "first" (default) or
          "second"'
        type: string
      day:
        type: integer
      dest_tz:
        description: e.g., "Asia/Tokyo"
        type: string
      hour:
        type: integer
      minute:
        type: integer
      month:
        type: integer
      non_existent_policy:
        description: 'Policy for non-existent times (spring forward): "forward" (default,
          shifts forward) or "error"'
        type: string
      second:
        type: integer
      source_tz:
        description: e.g., "America/New_York"
        type: string
      year:
        type: integer
    type: object
  converter.TimeConversionResponse:
    properties:
      dest_offset:
        type: string
      dest_time_local:
        description: ISO 8601 with offset
        type: string
      dest_time_utc:
        description: ISO 8601
        type: string
      dest_zone_name:
        type: string
      is_next_day:
        type: boolean
      is_prev_day:
        type: boolean
      resolution:
        $ref: '#/definitions/converter.TimeResolution'
      source_offset:
        description: e.g. "-04:00"
        type: string
      source_time_local:
        description: ISO 8601 with offset
        type: string
      source_time_utc:
        description: ISO 8601
        type: string
      source_zone_name:
        description: e.g. "EDT"
        type: string
      warning:
        type: string
    type: object
  converter.TimeResolution:
    enum:
    - normal
    - ambiguous
    - non-existent
    type: string
    x-enum-varnames:
    - ResolutionNormal
    - ResolutionAmbiguous
    - ResolutionNonExistent
host: localhost:8080
info:
  contact: {}
  description: Utility Microservice for converting files.
  title: File Converter API
  version: "1.0"
paths:
  /calculate-age:
    post:
      consumes:
      - application/json
      description: Calculates exact age, next birthday, and life summary based on
        date of birth and a reference date.
      parameters:
      - description: Age Calculation Request (Dates in YYYY-MM-DD format)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.AgeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Age Result
          schema:
            $ref: '#/definitions/converter.AgeCalculationResponse'
        "400":
          description: Bad Request
          schema:
            type: string
      summary: Age Calculator
  /calculate-bmi:
    post:
      consumes:
      - application/json
      description: Calculates Body Mass Index (BMI) based on weight and height
      parameters:
      - description: BMI Calculation Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.BMIRequest'
      produces:
      - application/json
      responses:
        "200":
          description: BMI Result
          schema:
            $ref: '#/definitions/api.BMIResponse'
        "400":
          description: Bad Request
          schema:
            type: string
      summary: BMI Calculator
  /convert:
    post:
      consumes:
      - multipart/form-data
      description: Converts any supported file type to another supported file type
        dynamically.
      parameters:
      - description: Source file type (e.g. txt, csv, json, pdf, docx, jpg, png)
        in: formData
        name: fromType
        required: true
        type: string
      - description: Target file type (e.g. txt, csv, json, pdf, docx, jpg, png)
        in: formData
        name: toType
        required: true
        type: string
      - description: The file to convert
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/octet-stream
      responses:
        "200":
          description: The converted file
          schema:
            type: file
        "400":
          description: Bad Request or unsupported combination
          schema:
            type: string
      summary: Universal File Converter
  /convert-measurement:
    post:
      consumes:
      - application/json
      description: Converts measurements between different units (e.g., meters to
        feet)
      parameters:
      - description: Conversion Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.MeasurementRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Conversion Result
          schema:
            $ref: '#/definitions/api.MeasurementResponse'
        "400":
          description: Bad Request
          schema:
            type: string
      summary: Measurement Converter
  /convert-numeral:
    post:
      consumes:
      - application/json
      description: Converts between numeral systems like binary, decimal, octal, hexadecimal.
      parameters:
      - description: Conversion Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.NumeralRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Conversion Result
          schema:
            $ref: '#/definitions/api.NumeralResponse'
        "400":
          description: Bad Request
          schema:
            type: string
      summary: Numeral System Converter
  /convert-railway:
    post:
      consumes:
      - application/json
      description: Converts between 12-hour AM/PM and 24-hour Indian Railway time
        format.
      parameters:
      - description: Railway Conversion Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/converter.RailwayConversionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Conversion Result
          schema:
            $ref: '#/definitions/converter.RailwayConversionResponse'
        "400":
          description: Bad Request
          schema:
            type: string
      summary: Railway Time Converter
  /convert-time:
    post:
      consumes:
      - application/json
      description: Converts date and time from any location/time zone to any other
        location/time zone accurately.
      parameters:
      - description: Time Conversion Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/converter.TimeConversionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Conversion Result
          schema:
            $ref: '#/definitions/converter.TimeConversionResponse'
        "400":
          description: Bad Request
          schema:
            type: string
      summary: Universal Time Converter
swagger: "2.0"
